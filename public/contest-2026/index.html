<!doctype html>
<html lang="ko">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데이터과학인의 밤 공모전</title>
<meta property="og:title" content="데이터과학인의 밤 공모전">
<meta property="og:description" content="공모전별 경쟁률과 신청 마감 카운트다운">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,500;112,800&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#F4F6F2;--dim:rgba(244,246,242,.55);--sep:rgba(244,246,242,.3);--line:rgba(244,246,242,.14)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:#050807;
  background-image:
    radial-gradient(ellipse 60% 45% at 50% 0%, rgba(120,190,150,.28), transparent 70%),
    radial-gradient(ellipse 80% 60% at 50% 100%, rgba(40,70,55,.35), transparent 70%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Archivo","Noto Sans KR","Malgun Gothic",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65))}
.wrap{position:relative;z-index:1;width:100%;max-width:1500px;padding:clamp(24px,4vh,56px) clamp(16px,3vw,48px)}
.kr{font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
h1{margin:0;font-weight:800;font-size:clamp(22px,2.6vw,42px);letter-spacing:.08em}
.sub{margin:10px 0 0;font-weight:500;font-size:clamp(12px,1vw,16px);letter-spacing:.35em;color:var(--dim)}

.timer{display:flex;justify-content:center;align-items:flex-start;gap:clamp(8px,1.6vw,28px);margin-top:clamp(20px,3vh,40px)}
.unit{min-width:1.6em}
.big{font-weight:800;font-variation-settings:"wdth" 112;font-variant-numeric:tabular-nums;line-height:1}
.timer .big{font-size:clamp(34px,7vw,120px)}
@media (max-width:500px){.timer{gap:4px}.colon{font-size:26px}.lab{letter-spacing:.12em}}
.lab{margin-top:12px;font-weight:500;font-size:clamp(10px,.9vw,15px);letter-spacing:.3em;color:var(--dim)}
.colon{font-weight:800;font-size:clamp(34px,5vw,86px);line-height:1.15;color:var(--sep)}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:clamp(32px,6vh,72px);border-top:1px solid var(--line)}
.c{padding:clamp(20px,3vh,36px) clamp(10px,1.2vw,20px) 0}
.c + .c{border-left:1px solid var(--line)}
.name{font-weight:700;font-size:clamp(13px,1.05vw,17px);letter-spacing:.02em;min-height:2.8em;display:flex;align-items:center;justify-content:center;line-height:1.4}
.ratio{margin-top:clamp(12px,2vh,22px);font-size:clamp(40px,4.6vw,80px)}
.ratio .s{color:var(--sep)}
.ratio-lab{margin-top:10px}
.ev{margin-top:clamp(18px,3vh,32px);font-weight:800;font-size:clamp(14px,1.3vw,22px)}
.ev b{font-family:"Archivo",sans-serif;font-weight:800;font-variation-settings:"wdth" 112;font-size:1.35em;letter-spacing:.01em}
.meta{margin-top:10px;font-weight:500;font-size:clamp(11px,.9vw,14px);color:var(--dim)}
.bump{animation:bump .7s ease}
@keyframes bump{40%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}
@media (max-width:900px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c:nth-child(3){border-left:0}
  .c:nth-child(n+3){border-top:1px solid var(--line);margin-top:24px}
}

.foot{position:fixed;left:14px;bottom:10px;font-size:11px;color:rgba(244,246,242,.3);z-index:2}
.fs{position:fixed;right:14px;bottom:10px;background:transparent;color:rgba(244,246,242,.4);border:1px solid rgba(244,246,242,.2);border-radius:6px;padding:6px 10px;font:500 12px "Noto Sans KR",sans-serif;cursor:pointer;z-index:2}
.fs:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.foot a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="kr">데이터과학인의 밤 공모전</h1>
  <p class="sub kr" id="sub">행사까지</p>

  <div class="timer">
    <div class="unit"><div class="big" id="mo">00</div><div class="lab">MONTHS</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="big" id="d">00</div><div class="lab">DAYS</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="big" id="h">00</div><div class="lab">HOURS</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="big" id="mi">00</div><div class="lab">MIN</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="big" id="s">00</div><div class="lab">SEC</div></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="foot kr" id="upd"></div>
<button class="fs" id="fs" title="전체화면 (F)">전체화면</button>

<script>
var API = 'https://script.google.com/macros/s/AKfycbyMqKwjoO3gLgeYeNqxC07VrOLV493Cc35ibuZOzZz2ygkgYI2rx4PrGKdIpTmjVRgc/exec';
var target = null, prev = {};
function pad(n){ return String(n).padStart(2,'0'); }
function set(id,v){ var e=document.getElementById(id); if(e) e.textContent=v; }

function tick(){
  if(!target) return;
  var now=new Date();
  if(now>=target){ ['mo','d','h','mi','s'].forEach(function(i){ set(i,'00'); }); return; }
  var m=(target.getFullYear()-now.getFullYear())*12+(target.getMonth()-now.getMonth());
  var a=new Date(now); a.setMonth(now.getMonth()+m);
  if(a>target){ m--; a=new Date(now); a.setMonth(now.getMonth()+m); }
  var r=Math.floor((target-a)/1000);
  set('mo',pad(m)); set('d',pad(Math.floor(r/86400))); r%=86400;
  set('h',pad(Math.floor(r/3600))); r%=3600; set('mi',pad(Math.floor(r/60))); set('s',pad(r%60));
}

/* 기대수익: 지금 신청하면 신청 팀은 n+1. 채워지는 수상 자리 상금 합 ÷ (n+1) */
function expected(n, prizes){
  var N=n+1, k=Math.min(N,prizes.length), sum=0;
  for(var i=0;i<k;i++) sum+=prizes[i];
  return Math.round(sum/N/100)*100;
}

function draw(s){
  var dl=s.deadline||s.eventDate;
  target=new Date(dl+(s.deadline?'T23:59:59':'T00:00:00'));
  set('sub', s.deadline?'신청 마감까지':'행사까지');
  var g=document.getElementById('grid'), html='';
  s.competitions.forEach(function(c){
    var set_=c.prizes&&c.prizes.length;
    var ratio=set_?(Math.round(c.n/c.awards*10)/10).toFixed(1):'-';
    var ev=set_?expected(c.n,c.prizes).toLocaleString('ko-KR'):'-';
    html+='<div class="c">'+
      '<div class="name kr">'+c.name.replace(/</g,'&lt;')+'</div>'+
      '<div class="big ratio" id="r_'+c.id+'">'+ratio+' <span class="s">:</span> 1</div>'+
      '<div class="lab ratio-lab kr">경쟁률</div>'+
      '<div class="ev kr">기대수익 <b>'+ev+'</b>원</div>'+
      '<div class="meta kr">신청 '+c.n+s.unit+' · 수상 '+c.awards+s.unit+'</div>'+
    '</div>';
  });
  g.innerHTML=html;
  s.competitions.forEach(function(c){
    if(prev[c.id]!=null && c.n>prev[c.id]){ var e=document.getElementById('r_'+c.id); if(e) e.classList.add('bump'); }
    prev[c.id]=c.n;
  });
  var foot='마지막 확인 '+s.updatedAt;
  if(s.formUrl) foot+=' · <a href="'+s.formUrl+'" target="_blank" rel="noopener">신청서</a>';
  document.getElementById('upd').innerHTML=foot;
  tick();
}

function poll(){
  fetch(API+'?format=json',{cache:'no-store'}).then(function(r){ return r.json(); }).then(draw).catch(function(){ set('upd','연결 확인 중…'); });
}
poll(); setInterval(poll,15000); setInterval(tick,1000);

function toggleFs(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); }
document.getElementById('fs').onclick=toggleFs;
document.addEventListener('keydown',function(e){ if(e.key==='f'||e.key==='F') toggleFs(); });
</script>
</body>
</html>
