<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSINU</title>
<meta name="description" content="인천대학교 데이터과학과 서비스와 소식">
<meta property="og:title" content="DSINU">
<meta property="og:description" content="인천대학교 데이터과학과 서비스와 소식">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 fill=%22black%22/><rect x=%225%22 y=%2218%22 width=%225%22 height=%229%22 fill=%22white%22/><rect x=%2213%22 y=%2210%22 width=%225%22 height=%2217%22 fill=%22white%22/><rect x=%2221%22 y=%225%22 width=%225%22 height=%2222%22 fill=%22white%22/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gasoek+One&display=swap" rel="stylesheet">
<style>
/* 시안 07-1 덧붙이는 벽 — 어두운 벽 #262626, 포스터는 사이트 팔레트, Black Han Sans·Gasoek One·Pretendard */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:#262626;color:#FFFFFF;font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #FFCF24;outline-offset:4px}
.in{max-width:1440px;margin:0 auto;position:relative}
.bhs{font-family:"Black Han Sans","Pretendard Variable",sans-serif;font-weight:400}
.gso{font-family:"Gasoek One","Black Han Sans",sans-serif;font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;flex:none}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:#FFCF24;color:#000000;padding:10px 14px;font-weight:800}
.skip:focus{left:8px}

/* 헤더 */
.hd{background:#000000;color:#FFFFFF;position:relative;z-index:50}
.hd-in{min-height:72px;display:flex;align-items:center;gap:24px;padding:0 40px}
.h1{margin:0;font:inherit;display:flex;flex:none}
.brand{display:inline-flex;align-items:center;gap:12px;flex:none;min-height:44px}
.logo{font-size:31px;line-height:1;letter-spacing:.01em}
.dept{font-size:14px;font-weight:700;padding-top:4px}
.nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nb{height:44px;padding:0 13px;font-size:15px;font-weight:700;border:1px solid transparent;white-space:nowrap;flex:none}
.nb:hover{border-color:#FFFFFF}
.nb[aria-pressed="true"]{background:#FFFFFF;color:#000000}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.ib{width:44px;height:44px;display:grid;place-items:center;border:1px solid #FFFFFF;border-radius:50%;flex:none}
.ib:hover,.ib[aria-expanded="true"]{background:#FFFFFF;color:#000000}
.search input{height:44px;width:min(240px,46vw);border:1px solid #FFFFFF;border-radius:999px;background:#000000;color:#FFFFFF;padding:0 16px;outline-offset:2px}
.search input::placeholder{color:#A8A8A8}
.cta{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:999px;background:#FFCF24;color:#000000;font-size:15px;font-weight:800;white-space:nowrap;flex:none}
.cta:hover{background:#FFFFFF}

/* 벽 */
.band{background:#262626;position:relative;overflow:hidden}
.label{height:52px;display:flex;align-items:flex-end;gap:18px;padding:0 40px;font-size:13px;font-weight:700;line-height:24px;color:#B8B8B8;position:relative;z-index:2}
.label b{color:#FFFFFF;font-weight:800;margin-right:5px}
.label .date{margin-left:auto;font-variant-numeric:tabular-nums}
.wall{position:relative}
.stage{position:absolute;left:50%;top:0;width:1440px;transform-origin:50% 0;isolation:isolate}
.seam-v{position:absolute;top:0;bottom:0;width:1px;background:#313131}
.seam-h{position:absolute;left:0;right:0;height:1px;background:#313131}
.scrap{position:absolute;z-index:0;pointer-events:none}
.msg{padding:120px 40px 160px;text-align:center;font-size:18px;font-weight:700;color:#D0D0D0}
.wall.flow{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:32px 24px;padding:24px 24px 56px;justify-items:center;align-items:start}
.wall.flow .stage{display:contents}
.wall.flow .seam-v,.wall.flow .seam-h,.wall.flow .scrap{display:none}
.wall.flow .p{position:relative;left:auto!important;top:auto!important;width:100%!important;height:auto!important;max-width:440px;aspect-ratio:var(--ar);z-index:auto!important}

/* 포스터 */
.p{position:absolute;display:block;color:#000000;-webkit-tap-highlight-color:transparent}
.lift{position:absolute;inset:0;filter:drop-shadow(rgba(0,0,0,.5) 0 1px 1px)}
.torn{position:absolute;inset:0;container-type:size}
.ink{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column;padding:max(14px,4.6cqw);clip-path:inset(0% 0% 0% 0%);transform-origin:50% 0%}
.roll{position:absolute;z-index:6;left:0;right:0;top:0;height:26px;background:rgba(255,255,255,.46);border-bottom:2px solid rgba(0,0,0,.22);opacity:0;visibility:hidden;pointer-events:none}
.psh{position:absolute;right:0;bottom:0;width:0;height:0;background:rgba(0,0,0,.4);clip-path:polygon(0 0,100% 0,0 100%);pointer-events:none}
.flap{position:absolute;right:0;bottom:0;width:0;height:0;clip-path:polygon(0 0,100% 0,0 100%);pointer-events:none}

.k-blue{background:#1F3DFF;color:#FFFFFF}
.k-yel{background:#FFCF24;color:#000000}
.k-grn{background:#00A676;color:#000000}
.k-org{background:#FF5A36;color:#000000}
.k-bei{background:#E9E4DA;color:#000000}
.k-blk{background:#000000;color:#FFCF24}
.k-pnk{background:#F2A7D0;color:#000000}
.k-wht{background:#FFFFFF;color:#000000}
.k-ink{background:#0A0A0A;color:#FFFFFF}

/* 포스터 공통 조각 */
.c-top{display:flex;justify-content:space-between;gap:10px;font-size:clamp(11px,2.9cqw,13px);font-weight:800;line-height:1.25;border-top:2px solid currentColor;padding-top:7px;flex:none}
.sum{font-size:clamp(12px,3.4cqw,16px);line-height:1.45;font-weight:600;margin-top:8px;flex:none}
.fine{display:grid;grid-template-columns:auto 1fr;column-gap:10px;font-size:12px;line-height:15px;border-top:1.5px solid currentColor;padding-top:7px;margin-top:10px;flex:none}
.fine span{font-weight:500}
.fine b{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt-a{margin-top:auto}
.stamp{position:absolute;z-index:2;display:inline-block;padding:.3em .5em .2em;border:3px solid currentColor;outline:1.5px solid currentColor;outline-offset:3px;font-size:clamp(16px,6cqw,26px);line-height:1;letter-spacing:.04em;white-space:nowrap;top:15%;right:6%;transform:rotate(-10deg)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:clamp(12px,3.2cqw,14px);font-weight:800;flex:none;padding-right:30px}
.foot .u{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{position:relative;flex:1 1 auto;min-height:36px}
.chart svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.chart path,.chart line{fill:none;stroke:currentColor;vector-effect:non-scaling-stroke}
.title{line-height:1;flex:none}

/* 행사 */
.L-ev .kick{font-size:clamp(17px,7.6cqw,34px);line-height:1.1;margin-top:14px}
.L-ev .title{font-size:clamp(24px,13.4cqw,60px)}
.L-ev .chart{margin:12px 0 8px}
.L-ev .chart path{stroke-width:4}
.L-ev .dd{font-size:44cqw;line-height:.8;letter-spacing:-.03em;white-space:nowrap;padding-top:4px;flex:none}
.L-ev .facts{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid currentColor;border-bottom:2px solid currentColor;margin-top:16px;flex:none}
.L-ev .facts>div{display:flex;flex-direction:column;gap:5px;padding:9px 0 11px;min-width:0}
.L-ev .facts>div+div{border-left:2px solid currentColor;padding-left:14px}
.L-ev .facts span{font-size:12px;font-weight:700}
.L-ev .facts b{font-size:clamp(18px,6.8cqw,30px);line-height:1;font-weight:400;white-space:nowrap}
.L-ev .sum{font-size:clamp(13px,3.6cqw,16px);font-weight:700}

/* 큰 서비스 */
.L-ft .title{font-size:clamp(34px,22cqw,92px);line-height:.92;margin-top:14px;letter-spacing:-.01em}
.L-ft .sum{font-size:clamp(13px,4cqw,16px);font-weight:700;max-width:80%;margin-top:14px}
.L-ft .meta{font-size:12px;font-weight:800;line-height:16px;margin-top:8px;flex:none}
.L-ft .meta span{font-weight:500;margin-right:6px}
.L-ft .rows{margin-top:auto;flex:none}
.L-ft .rh{display:flex;justify-content:space-between;font-size:12px;font-weight:800;padding-bottom:5px;border-bottom:2px solid currentColor}
.L-ft .r{display:flex;justify-content:space-between;align-items:center;height:26px;border-bottom:1px solid currentColor;font-size:14px;font-weight:700}
.L-ft .r b{font-size:19px;line-height:1}
.L-ft .stamp{top:max(64px,15%)}
.L-ft .chart{display:flex;align-items:flex-end;gap:4px;margin-top:16px;border-bottom:2px solid currentColor;min-height:40px}
.L-ft .chart i{flex:1;background:currentColor}

/* 제목형 */
.L-hd .title{font-size:clamp(24px,12.5cqw,58px);line-height:1.02;margin-top:12px}
.L-hd .chart{display:flex;align-items:flex-end;gap:3px;margin-top:14px;border-bottom:2px solid currentColor;min-height:28px}
.L-hd .chart i{flex:1;background:currentColor}
.L-hd .chart.ln{border-bottom:0;margin-bottom:6px}
.L-hd .chart.ln path{stroke-width:4}
@container (max-width:300px){
  .L-ev .kick,.L-ev .foot>span:first-child{display:none}
  .L-ev .facts b{font-size:17px}
  .L-ft .meta{display:none}
}

/* 큰 글자형 */
.L-gi .title{font-size:clamp(22px,11cqw,40px);line-height:1.05}
.L-gi .sum{max-width:88%}
.L-gi .big{flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;font-size:96cqw;line-height:.8;margin:0 0 -4% -4%;overflow:hidden;pointer-events:none}

/* 세로쓰기형 */
.L-vt .v{writing-mode:vertical-rl;flex:1 1 auto;min-height:0;align-self:flex-end;display:flex;overflow:hidden}
.L-vt .title{font-size:clamp(34px,24cqw,72px);line-height:1.02}
.L-vt .title span{display:block}
.L-vt .stamp{right:auto;left:6%;transform:rotate(-8deg)}

/* 첫 단어형 */
.L-sp .w0{font-size:40cqw;line-height:.92;white-space:nowrap;letter-spacing:-.01em;flex:none}
.L-sp .title{font-size:clamp(20px,11cqw,40px);line-height:1;margin-top:2px}
.L-sp .cells{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:10px;flex:none}
.L-sp .cells i{height:14px;border:1.5px solid currentColor}
.L-sp .cells i.on{background:currentColor}

/* 줄 쌓기형 */
.L-st .rws{border-bottom:3px solid currentColor;flex:none}
.L-st .rw{height:19cqw;display:flex;align-items:center;border-top:3px solid currentColor;font-size:15cqw;line-height:1;white-space:nowrap;overflow:hidden}
.L-st .rw.r{justify-content:flex-end}

/* 차트형 */
.L-br .chart{display:flex;align-items:flex-end;gap:4px;border-bottom:2px solid currentColor;min-height:60px}
.L-br .chart i{flex:1;background:currentColor}
.L-sc .chart{border-left:2px solid currentColor;border-bottom:2px solid currentColor;min-height:70px}
.L-sc .chart i{position:absolute;border-radius:50%;background:currentColor;transform:translate(-50%,50%)}
.L-sc .chart line{stroke-width:3}
.L-gr .cells{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:14px;flex:none}
.L-gr .cells i{height:12px;border:1.5px solid currentColor}
.L-gr .cells i.on{background:currentColor}
.L-gr .cells i.off{border-color:transparent}
.L-br .title,.L-sc .title{font-size:clamp(20px,10cqw,34px);line-height:1.05;margin-top:14px}
.L-gr .title{font-size:clamp(22px,13cqw,46px);line-height:1}
.L-gr .title span{display:block}

/* 이미지형 */
.L-cv{padding:0!important}
.L-cv img{display:block;width:100%;flex:1 1 auto;min-height:0;object-fit:cover}
.L-cv .cap{padding:max(14px,4.6cqw);padding-top:12px;flex:none}
.L-cv .title{font-size:clamp(20px,9cqw,34px);line-height:1.05}

/* 목록 */
.list{background:#141414;color:#FFFFFF;position:relative;z-index:2;padding-bottom:64px}
.list-in{padding:44px 40px 0}
.lh{display:flex;align-items:baseline;gap:14px;min-height:60px;border-bottom:2px solid #FFFFFF;flex-wrap:wrap;padding-bottom:10px}
.lh h2{font-size:36px;line-height:1;margin:0;font-weight:400}
.lh-n{font-size:36px;line-height:1;color:#FFCF24}
.counts{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;font-weight:700;color:#C8C8C8}
.counts b{color:#FFFFFF;font-weight:800;margin-left:5px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-flow:column;column-gap:40px;margin-top:8px}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;align-items:center;gap:12px;border-bottom:1px solid #3A3A3A;font-size:15px;min-height:48px;padding:0 6px}
a.row:hover{background:#262626}
a.row:hover .rn{text-decoration:underline;text-underline-offset:3px}
.ri{font-size:12px;font-weight:700;color:#A8A8A8;font-variant-numeric:tabular-nums}
.rn{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc{font-size:13px;font-weight:600;color:#C8C8C8;white-space:nowrap}
.rs{font-size:12px;font-weight:800;padding:3px 8px;white-space:nowrap;color:#C8C8C8}
.rs.soon{background:#FFCF24;color:#000000}
.sub{margin-top:56px}
.sub .lh h2,.sub .lh-n{font-size:28px}
.period{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
.period button{height:40px;padding:0 14px;border:1px solid #5A5A5A;border-radius:999px;font-size:14px;font-weight:700;color:#D8D8D8}
.period button[aria-pressed="true"]{background:#FFFFFF;border-color:#FFFFFF;color:#000000}
.none{padding:18px 6px;color:#C8C8C8;font-weight:700}

/* 푸터 */
.ft{background:#000000;color:#FFFFFF}
.ft-in{min-height:80px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 40px;font-size:14px;font-weight:600;flex-wrap:wrap}
.ft a{display:inline-flex;align-items:center;height:44px;font-weight:800;text-decoration:underline;text-underline-offset:4px}

@media (max-width:1180px){
  .hd-in{flex-wrap:wrap;padding:10px 32px;gap:6px 20px}
  .nav{order:3;width:100%;margin-left:0}
  .tools{margin-left:auto}
}
@media (max-width:899px){
  .label{padding:0 24px}
  .list-in{padding:40px 24px 0}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row}
}
@media (max-width:600px){
  .hd-in{padding:10px 16px}
  .dept{font-size:13px}
  .nav{width:calc(100% + 32px);margin:0 -16px;padding:0 16px}
  .cta{padding:0 14px;font-size:14px}
  .search input{width:min(260px,calc(100vw - 100px))}
  .searching .cta{display:none}
  .label{padding:0 16px;gap:12px}
  .wall.flow{grid-template-columns:1fr;padding:20px 16px 48px}
  .list-in{padding:36px 16px 0}
  .lh h2,.lh-n{font-size:30px}
  .counts{margin-left:0;width:100%}
  .grid{grid-template-columns:1fr}
  .ft-in{padding:14px 16px}
}
</style>
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<header class="hd">
  <div class="in hd-in">
    <h1 class="h1"><a class="brand" href="/" aria-label="DSINU 첫 화면"><span class="logo bhs">DSINU</span><span class="dept">인천대학교 데이터과학과</span></a></h1>
    <nav class="nav" id="nav" aria-label="분류"></nav>
    <div class="tools">
      <div class="search" id="search" hidden><label class="sr" for="q">서비스와 소식 검색</label><input id="q" type="search" placeholder="검색" autocomplete="off"></div>
      <button class="ib" id="searchBtn" type="button" aria-label="검색 열기" aria-expanded="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"></circle><path d="M16 16l5.5 5.5"></path></svg></button>
      <span id="ctas" style="display:contents"></span>
    </div>
  </div>
</header>

<main id="main">
  <section class="band" aria-labelledby="wallH">
    <h2 id="wallH" class="sr">서비스와 소식</h2>
    <div class="in label" id="label"><span><b>서비스</b><span id="nSvc">0</span></span><span id="nNewsWrap"><b>소식</b><span id="nNews">0</span></span><span class="date" id="today"></span></div>
    <div class="wall" id="wall"></div>
  </section>

  <section class="list" aria-labelledby="allH">
    <div class="in list-in">
      <div class="lh"><h2 id="allH" class="bhs">전체 서비스</h2><span class="lh-n bhs" id="nAll">0</span><div class="counts" id="counts"></div></div>
      <div class="grid" id="grid"></div>
      <div class="sub" id="newsBox" hidden>
        <div class="lh"><h2 class="bhs">소식</h2><span class="lh-n bhs" id="nNews2">0</span></div>
        <div class="grid" id="newsGrid"></div>
      </div>
      <div class="sub" id="pop" hidden>
        <div class="lh"><h2 class="bhs">많이 찾는 서비스</h2><div class="period" id="period"></div></div>
        <div class="grid" id="popGrid"></div>
      </div>
    </div>
  </section>
</main>

<footer class="ft">
  <div class="in ft-in"><span>© <span id="yr"></span> 인천대학교 데이터과학과</span><a href="https://www.haiinu.com/">HAI Lab</a></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
<script>
(function(){
  'use strict';
  var CATS=['학습','학과생활','정보','도구','연구'];
  var KIND={service:'서비스',event:'행사',showcase:'프로젝트',notice:'공지'};
  var PERIODS=[['7','이번 주'],['30','이번 달'],['365','올해'],['all','전체']];
  var POP_MIN=3, POP_MAX=5, STAGE_MIN=900;
  var ARROW='<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg>';
  var COLORS={blue:'k-blue',yellow:'k-yel',green:'k-grn',orange:'k-org',beige:'k-bei',black:'k-blk',pink:'k-pnk',white:'k-wht',ink:'k-ink'};
  var BG={'k-blue':'#1F3DFF','k-yel':'#FFCF24','k-grn':'#00A676','k-org':'#FF5A36','k-bei':'#E9E4DA','k-blk':'#000000','k-pnk':'#F2A7D0','k-wht':'#FFFFFF','k-ink':'#0A0A0A'};
  var HASHC=['k-org','k-grn','k-pnk','k-blk','k-bei','k-wht','k-ink','k-blue','k-yel'];

  function tear(seed,w,h){
    var r=rng('tear-'+seed), CL=64, pts=[], iA=0;

    var lens=[w,h,w,h], bE=[0,0,1,3][Math.floor(r()*4)], bLen=40+r()*80, bDep=8+r()*8;
    var lo=(bE===2?CL:cut[bE])+20, hi=lens[bE]-bLen-20-(bE===1?CL:cut[(bE+1)%4]);
    var bOn=r()<0.7&&hi>lo, bA=lo+r()*Math.max(0,hi-lo);
    function at(e,t,d){ return e===0?[t,d]:(e===1?[w-d,t]:(e===2?[w-t,h-d]:[d,h-t])); }

    for(var e=0;e<4;e++){
      var len=lens[e], ce=cut[(e+1)%4];
      var st=(e===2)?CL:(cut[e]>0?cut[e]:8), en=(e===1)?len-CL:(ce>0?len-ce:len-8);
      if(e===2){ iA=pts.length; pts.push([w,h]); pts.push([w,h]); }
      else if(cut[e]>0){
        var pe=(e+3)%4, a=at(pe,lens[pe]-cut[e],0), b=at(e,cut[e],0);
        var ix=(e===0||e===3)?1:-1, iy=(e===0||e===1)?1:-1, cc=cut[e];
        [0.34,0.67].forEach(function(u){ var q=r()*cc*0.28; push([a[0]+(b[0]-a[0])*u+ix*q, a[1]+(b[1]-a[1])*u+iy*q]); });
      } else push(at(e,r()*1.4,r()*1.4));
      var t=st, guard=0;
      while(guard++<400){
        var dd=J();
        if(bOn&&e===bE&&t>=bA&&t<=bA+bLen) dd+=bDep*Math.sin(Math.PI*(t-bA)/bLen)*(0.7+r()*0.6);
        push(at(e,Math.min(t,en),dd));
        if(t>=en) break;
        var inT=bOn&&e===bE&&t+30>=bA&&t<=bA+bLen;
        t=Math.min(t+(inT?5+r()*7:12+r()*18),en);
      }
    }

  }

    var models=[];
    list.forEach(function(it,i){
      var f=fr[i], r=rng('poster-'+it.key), lay=pickLayout(it,f,r), k=pickColor(it,lay,r), tr=tear(it.key,f[3],f[4]);
      var rot=mode==='flow'?+(f[5]*0.6).toFixed(2):f[5];
      var tag=live(it)?'a':'div', href=live(it)?' href="'+esc(it.url)+'"':'';
      html+='<'+tag+' class="p" data-i="'+i+'"'+href+' style="left:'+(f[1]+dx)+'px;top:'+f[2]+'px;width:'+f[3]+'px;height:'+f[4]+'px;z-index:'+(1000-i)+';--ar:'+Math.max(f[3]/f[4],0.66).toFixed(3)+';transform:rotate('+rot+'deg)">'+
        '<div class="lift"><div class="torn" style="clip-path:'+tr.clip+'"><div class="ink '+k+' L-'+lay+'">'+T[lay](it,r)+'<span class="roll" aria-hidden="true"></span></div></div>'+
        '<span class="psh" aria-hidden="true"></span><span class="flap" aria-hidden="true" style="background:'+mix('#D9D3C4',BG[k],0.22)+'"></span></div></'+tag+'>';
      models.push({it:it,i:i,slot:f[0],rot:rot,z:1000-i,tear:tr,pk:{k:0}});
    });
    html+='</div>';
    wall.innerHTML=html;
    var els=wall.querySelectorAll('.p');
    M=models.map(function(m,j){ var el=els[j]; m.el=el; m.ink=el.querySelector('.ink'); m.roll=el.querySelector('.roll'); m.torn=el.querySelector('.torn'); m.lift=el.querySelector('.lift'); m.flap=el.querySelector('.flap'); m.psh=el.querySelector('.psh'); m.stamp=el.querySelector('.stamp'); return m; });
    M.forEach(function(m){ m.el.addEventListener('click',function(){ track(m.it); }); });
    wall.dataset.sh=SH;
    scaleStage();
    fit();
    motion(intro);
    applyDim(false);
  }
  function scaleStage(){
    var wall=$('wall'), st=$('stage'); if(!st) return;
    if(mode!=='stage'){ st.style.transform=''; wall.style.height=''; return; }
    var s=Math.min(1,wall.clientWidth/1440), SH=+wall.dataset.sh||0;
    st.style.transform='translateX(-50%) scale('+s+')';
    wall.style.height=Math.ceil(SH*s)+'px';
  }
  function fit(){
    [].forEach.call(document.querySelectorAll('[data-fit]'),function(el){
      el.style.fontSize='';
      var w=el.clientWidth, sw=el.scrollWidth;
      if(w>0&&sw>w){ var fs=parseFloat(getComputedStyle(el).fontSize)||0; if(fs) el.style.fontSize=Math.floor(fs*w/sw*0.98)+'px'; }
    });
  }

  /* ---------- 모션 ---------- */
  var SH0='drop-shadow(rgba(0,0,0,.5) 0px 1px 1px)', SH1='drop-shadow(rgba(0,0,0,.55) 0px 10px 9px)', zTop=2000, cursor=0;
  function polyPeel(m,px){
    var pts=m.tear.pts, ia=m.tear.iA, w=m.el.offsetWidth||1, h=m.el.offsetHeight||1, out=[];
    for(var j=0;j<pts.length;j++){
      var p=pts[j];
      if(px>0&&j===ia) p=[100,+(100-px/h*100).toFixed(2)];
      else if(px>0&&j===ia+1) p=[+(100-px/w*100).toFixed(2),100];
      out.push(p[0]+'% '+p[1]+'%');
    }
    return 'polygon('+out.join(', ')+')';
  }
  function raise(m){ zTop++; m.z=zTop; m.el.style.zIndex=String(zTop); }
  function shift(m){ if(mode!=='stage'||!g) return; g.set(m.el,{x:g.utils.random(-6,6,1),y:g.utils.random(-5,5,1),rotation:m.rot+g.utils.random(-0.8,0.8,0.05)}); }
  function paste(tl,m,at,fast,ir){
    var d=fast?0.42:0.64, H=m.el.offsetHeight||300, B=26;
    tl.fromTo(m.ink,{clipPath:'inset(0% 0% 100% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:d,ease:'power2.inOut',immediateRender:ir,overwrite:'auto'},at);
    tl.fromTo(m.ink,{scaleY:1.025,transformOrigin:'50% 0%'},{scaleY:1,duration:d+0.4,ease:'power2.out',immediateRender:ir,overwrite:'auto'},at);
    if(m.roll){ tl.fromTo(m.roll,{y:-B,autoAlpha:1},{y:H-B,duration:d,ease:'power2.inOut',immediateRender:false,overwrite:'auto'},at); tl.to(m.roll,{autoAlpha:0,duration:0.18,ease:'none'},at+d); }
    return tl;
  }
  function repaste(m,tl,at,fast){ tl.call(function(){ raise(m); shift(m); },null,at); paste(tl,m,at,fast,false); }
  function peel(m,onn){
    var P=mode==='flow'?28:34;
    if(!g){ m.torn.style.clipPath=onn?polyPeel(m,P):m.tear.clip; if(m.flap){ m.flap.style.width=m.flap.style.height=(onn?P:0)+'px'; } if(m.psh){ m.psh.style.width=m.psh.style.height=(onn?P+8:0)+'px'; } return; }
    var D=reduce?0:1, du=(onn?0.34:0.26)*D, e=onn?'back.out(2.2)':'power2.inOut';
    g.to(m.lift,{y:onn?-4:0,filter:onn?SH1:SH0,duration:(onn?0.28:0.36)*D,ease:'power2.out',overwrite:'auto'});
    if(m.flap) g.to(m.flap,{width:onn?P:0,height:onn?P:0,duration:du,ease:e,overwrite:'auto'});
    if(m.psh) g.to(m.psh,{width:onn?P+8:0,height:onn?P+8:0,duration:du,ease:e,overwrite:'auto'});
    g.to(m.pk,{k:onn?1:0,duration:du,ease:e,overwrite:'auto',
      onUpdate:function(){ m.torn.style.clipPath=polyPeel(m,Math.max(0,m.pk.k)*P); },
      onComplete:function(){ if(!onn) m.torn.style.clipPath=m.tear.clip; }});
  }
  function slots(){
    var S={}, order=[];
    M.forEach(function(m){ if(!S[m.slot]){ S[m.slot]={k:m.slot,hover:false,items:[]}; order.push(S[m.slot]); } S[m.slot].items.push(m); });
    return {map:S,order:order};
  }
  var SL=null;
  function motion(intro){
    SL=slots();
    M.forEach(function(m){
      var s=SL.map[m.slot];
      function en(){ s.hover=true; peel(m,true); }
      function lv(){ s.hover=false; peel(m,false); }
      m.el.addEventListener('mouseenter',en); m.el.addEventListener('mouseleave',lv);
      m.el.addEventListener('focus',en); m.el.addEventListener('blur',lv);
    });
    if(!g) return;
    ctx=g.context(function(){
      g.set(M.map(function(m){ return m.lift; }),{filter:SH0});
      M.forEach(function(m){ m.el.style.transform=''; g.set(m.el,{x:0,y:0,rotation:m.rot}); });
      if(reduce) return;
      var se=document.scrollingElement||document.documentElement, scrolls=se.scrollHeight>window.innerHeight+40;
      if(intro&&!introDone){
        var tl=g.timeline({delay:0.1}), t=0.2;
        if(mode==='stage'){
          SL.order.forEach(function(s){ s.items.slice().sort(function(a,b){ return a.z-b.z; }).forEach(function(m,j){ paste(tl,m,t+j*0.2,false,true); }); t+=0.36; });
          var st=M.map(function(m){ return m.stamp; }).filter(Boolean);
          if(st.length) tl.from(st,{scale:1.8,opacity:0,duration:0.26,ease:'power4.in',stagger:0.12},t+0.5);
        } else {
          M.forEach(function(m,i){
            if(scrolls&&window.ScrollTrigger) paste(g.timeline({scrollTrigger:{trigger:m.el,start:'top bottom',once:true}}),m,0,false,true);
            else paste(tl,m,t+i*0.12,false,true);
          });
        }
        introDone=true;
      }
      if(mode==='stage'&&SL.order.some(function(s){ return s.items.length>1; })){
        iv=setInterval(function(){ if(ctx) ctx.add(tick); },3500);
      }
    },$('wall'));
  }
  function tick(){
    if(document.hidden||!SL) return;
    var CY=CYCLE.map(function(k){ return SL.map[k]; }).filter(Boolean);
    for(var k=0;k<CY.length;k++){
      var s=CY[(cursor+k)%CY.length];
      if(s.hover||s.items.length<2) continue;
      var st=s.items.slice().sort(function(a,b){ return a.z-b.z; }), c=null;
      for(var j=0;j<st.length;j++){ if(hit(st[j].it)){ c=st[j]; break; } }
      if(!c||c===st[st.length-1]) continue;
      cursor=(cursor+k+1)%CY.length;
      repaste(c,g.timeline(),0,false);
      return;
    }
  }
  /* 분류·검색: 해당 포스터를 자기 자리 맨 위에 다시 붙이고 나머지는 흐리게 */
  function applyDim(repasteHits){
    var D=reduce||!g?0:1;
    M.forEach(function(m){ var o=hit(m.it)?1:0.3; if(g) g.to(m.el,{opacity:o,duration:0.35*D,ease:'power2.out',overwrite:'auto'}); else m.el.style.opacity=o; });
    if(!repasteHits||!g||!SL||(cur==='전체'&&!query)) return;
    var seq=[];
    SL.order.forEach(function(s){ s.items.filter(function(m){ return hit(m.it); }).sort(function(a,b){ return b.i-a.i; }).forEach(function(m){ seq.push(m); }); });
    if(reduce){ seq.forEach(raise); return; }
    var add=function(){ var tl=g.timeline(); seq.forEach(function(m,i){ repaste(m,tl,i*0.11,true); }); };
    if(ctx) ctx.add(add); else add();
  }

  /* ---------- 목록 ---------- */
  function renderLists(){
    var svc=services, news=pages;
    $('nAll').textContent=svc.length;
    $('counts').innerHTML=CATS.filter(function(c){ return svc.some(function(s){ return s.category===c; }); }).map(function(c){ return '<span>'+c+'<b>'+svc.filter(function(s){ return s.category===c; }).length+'</b></span>'; }).join('');
    var gEl=$('grid');
    gEl.innerHTML=svc.length?svc.map(function(s,k){
      var tag=live(s)?'a':'div', href=live(s)?' href="'+esc(s.url)+'"':'';
      return '<'+tag+' class="row" data-k="'+esc(s.key)+'"'+href+'><span class="ri">'+p2(k+1)+'</span><span class="rn">'+esc(s.title)+'</span><span class="rc">'+esc(s.category||'')+'</span><span class="rs'+(live(s)?'':' soon')+'">'+(live(s)?'운영':'준비 중')+'</span></'+tag+'>';
    }).join(''):'<p class="none">등록된 서비스 없음</p>';
    gEl.style.gridTemplateRows=window.innerWidth>=STAGE_MIN?'repeat('+Math.max(1,Math.ceil(svc.length/3))+',auto)':'';
    [].forEach.call(gEl.querySelectorAll('a.row'),function(a){ var it=svc.filter(function(s){ return s.key===a.getAttribute('data-k'); })[0]; if(it) a.addEventListener('click',function(){ track(it); }); });
    $('newsBox').hidden=!news.length;
    $('nNews2').textContent=news.length;
    $('newsGrid').innerHTML=news.map(function(p,k){
      return '<a class="row" data-k="'+esc(p.key)+'" href="'+esc(p.url)+'"><span class="ri">'+p2(k+1)+'</span><span class="rn">'+esc(p.title)+'</span><span class="rc">'+esc(KIND[p.type]||'소식')+'</span><span class="rs">'+(p.date?dday(p.date):(p.expires?'~'+dot(p.expires).slice(5):''))+'</span></a>';
    }).join('');
    $('newsGrid').style.gridTemplateRows=window.innerWidth>=STAGE_MIN?'repeat('+Math.max(1,Math.ceil(news.length/3))+',auto)':'';
    applyRows();
  }
  function applyRows(){
    [].forEach.call(document.querySelectorAll('#grid .row, #newsGrid .row'),function(r){
      var it=items.filter(function(x){ return x.key===r.getAttribute('data-k'); })[0];
      r.hidden=!!(it&&!hit(it));
    });
  }

  /* ---------- 많이 찾는 서비스 ---------- */
  function renderPop(counts){
    var list=services.filter(function(s){ return live(s)&&counts[s.key]>0; }).sort(function(a,b){ return counts[b.key]-counts[a.key]; }).slice(0,POP_MAX);
    $('pop').hidden=list.length<POP_MIN;
    $('period').innerHTML=PERIODS.map(function(p){ return '<button type="button" data-p="'+p[0]+'" aria-pressed="'+(period===p[0])+'">'+p[1]+'</button>'; }).join('');
    [].forEach.call($('period').querySelectorAll('button'),function(b){ b.addEventListener('click',function(){ period=b.getAttribute('data-p'); loadPop(); }); });
    $('popGrid').innerHTML=list.map(function(s,k){ return '<a class="row" href="'+esc(s.url)+'" data-k="'+esc(s.key)+'"><span class="ri">'+(k+1)+'</span><span class="rn">'+esc(s.title)+'</span><span class="rc">'+esc(s.category||'')+'</span><span class="rs">'+counts[s.key].toLocaleString('ko-KR')+'회</span></a>'; }).join('');
    $('popGrid').style.gridTemplateRows='';
    $('popGrid').style.gridAutoFlow='row';
    [].forEach.call($('popGrid').querySelectorAll('a.row'),function(a){ var it=services.filter(function(s){ return s.key===a.getAttribute('data-k'); })[0]; if(it) a.addEventListener('click',function(){ track(it); }); });
  }
  function loadPop(){
    if(popCache[period]) return renderPop(popCache[period]);
    if(DEMO){ var c={}; services.forEach(function(s){ if(s.demo){ var r=rng(s.key+period); c[s.key]=Math.round((period==='7'?4:period==='30'?16:period==='365'?120:180)*(0.3+r()*r()*3)); } }); popCache[period]=c; return renderPop(c); }
    fetch('/api/popular?days='+period).then(function(r){ return r.ok?r.json():{items:[]}; }).catch(function(){ return {items:[]}; })
      .then(function(j){ var c={}; (j.items||[]).forEach(function(x){ c[x.id]=x.n; }); popCache[period]=c; renderPop(c); });
  }

  /* ---------- 내비·검색 ---------- */
  function renderNav(){
    var opts=['전체'].concat(CATS.filter(function(c){ return services.some(function(s){ return s.category===c; }); }));
    if(pages.length) opts.push('소식');
    if(opts.indexOf(cur)<0) cur='전체';
    $('nav').innerHTML=opts.map(function(o){ return '<button type="button" class="nb" data-f="'+esc(o)+'" aria-pressed="'+(cur===o)+'">'+esc(o)+'</button>'; }).join('');
    [].forEach.call($('nav').querySelectorAll('.nb'),function(b){ b.addEventListener('click',function(){ setView(b.getAttribute('data-f')); }); });
    $('ctas').innerHTML=pages.filter(function(p){ return p.feature; }).slice(0,2).map(function(p){ return '<a class="cta" href="'+esc(p.url)+'">'+esc(p.feature)+ARROW+'</a>'; }).join('');
  }
  function setView(v){
    cur=(v==='소식'||CATS.indexOf(v)>-1)?v:'전체';
    history.replaceState(null,'',location.pathname+location.search+(cur==='전체'?'':'#'+encodeURIComponent(cur)));
    [].forEach.call($('nav').querySelectorAll('.nb'),function(b){ b.setAttribute('aria-pressed',String(b.getAttribute('data-f')===cur)); });
    applyDim(true); applyRows();
  }
  var sb=$('searchBtn'), sw=$('search'), qi=$('q');
  function openSearch(on){ sw.hidden=!on; document.querySelector('.hd-in').classList.toggle('searching',on); sb.setAttribute('aria-expanded',String(on)); sb.setAttribute('aria-label',on?'검색 닫기':'검색 열기'); if(on) qi.focus(); }
  sb.addEventListener('click',function(){ var on=sw.hidden; openSearch(on); if(!on&&query){ query=''; qi.value=''; applyDim(false); applyRows(); } });
  var qt=null;
  qi.addEventListener('input',function(){ clearTimeout(qt); qt=setTimeout(function(){ query=qi.value.trim(); applyDim(false); applyRows(); },120); });
  qi.addEventListener('keydown',function(e){ if(e.key==='Escape'){ query=''; qi.value=''; openSearch(false); applyDim(false); applyRows(); sb.focus(); } });

  /* ---------- 더미 테스트: 주소 뒤에 ?demo=N (기본 3). 기본 주소에는 나오지 않음 ---------- */
  var qp=new URLSearchParams(location.search);
  var DEMO=qp.has('demo')?Math.max(1,Math.min(60,parseInt(qp.get('demo'),10)||3)):0;
  function demoServices(n){
    var out=[];
    for(var i=0;i<n;i++){
      var d=DEMO_SET[i%DEMO_SET.length], lap=Math.floor(i/DEMO_SET.length), r=rng('demo'+i);
      var dt=new Date(T0); dt.setDate(dt.getDate()-(i===0?0:Math.round(i*3.2+r()*4)));
      out.push({key:'demo-'+i,type:'service',demo:true,title:d[0]+(lap?' '+(lap+1):''),summary:d[2],category:d[1],created:isoOf(dt),url:'#demo',status:(i%7===5)?'soon':'live',makers:[DEMO_MAKERS[i%DEMO_MAKERS.length]]});
    }
    return out;
  }

  /* ---------- 시작 ---------- */
  var now=new Date();
  $('yr').textContent=now.getFullYear();
  $('today').textContent=now.getFullYear()+'.'+p2(now.getMonth()+1)+'.'+p2(now.getDate())+' '+DOW[now.getDay()];
  var h0=decodeURIComponent(location.hash.slice(1)); if(h0==='소식'||CATS.indexOf(h0)>-1) cur=h0;
  g=window.gsap||null;
  if(g&&window.ScrollTrigger) g.registerPlugin(window.ScrollTrigger);
  if(g&&!reduce){ g.from('.hd-in > *',{y:-12,opacity:0,duration:0.45,stagger:0.06,ease:'power3.out',clearProps:'transform,opacity'}); }

  Promise.all([
    fetch('/pages.json',{cache:'no-store'}).then(function(r){ return r.json(); }),
    fetch('/apps.json',{cache:'no-store'}).then(function(r){ return r.json(); })
  ]).then(function(res){
    pages=res[0].filter(function(p){ return !p.hidden&&(!p.expires||p.expires>=TODAY); }).map(function(p){
      return {key:p.slug,type:p.type||'notice',title:p.title,summary:p.summary,tags:p.tags,created:p.created||'2000-01-01',cover:p.cover,url:'/'+p.slug+'/',feature:p.feature,expires:p.expires,date:p.date,facts:p.facts,factsTitle:p.factsTitle,poster:p.poster,color:p.color};
    });
    services=res[1].filter(function(a){ return a.status!=='hidden'; }).map(function(a){
      return {key:a.id,type:'service',title:a.name,summary:a.summary,category:a.category,tags:a.tags,makers:a.makers,created:a.created||'2000-01-01',cover:a.cover,url:a.url,status:a.status,facts:a.facts,factsTitle:a.factsTitle,poster:a.poster,color:a.color};
    });
    if(DEMO) services=services.concat(demoServices(DEMO));
    var byDate=function(a,b){ return b.created.localeCompare(a.created)||(live(b)?1:0)-(live(a)?1:0); };
    services.sort(byDate); pages.sort(byDate);
    items=services.concat(pages).sort(byDate);
    $('nSvc').textContent=services.length;
    $('nNews').textContent=pages.length;
    $('nNewsWrap').hidden=!pages.length;
    renderNav(); renderLists(); buildWall(true); loadPop();
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);
    if(g&&!reduce){
      var se=document.scrollingElement||document.documentElement;
      if(window.ScrollTrigger&&se.scrollHeight>window.innerHeight+40) g.from('#grid .row',{y:14,opacity:0,duration:0.45,ease:'power2.out',stagger:0.02,clearProps:'transform,opacity',scrollTrigger:{trigger:'#grid',start:'top bottom',once:true}});
    }
  }).catch(function(){ $('wall').innerHTML='<p class="msg">목록을 불러오지 못했습니다. 새로고침해 주세요.</p>'; });

  window.addEventListener('hashchange',function(){ var h=decodeURIComponent(location.hash.slice(1))||'전체'; if(h!==cur&&items.length) setView(h); });
  var rt=null, lastW=window.innerWidth;
  window.addEventListener('resize',function(){
    clearTimeout(rt);
    rt=setTimeout(function(){
      var w=window.innerWidth, nm=w<STAGE_MIN?'flow':'stage';
      if(!items.length) return;
      if(nm!==mode) buildWall(false); else { scaleStage(); fit(); }
      if((lastW<STAGE_MIN)!==(w<STAGE_MIN)) renderLists();
      lastW=w;
    },150);
  });
})();
</script>
</body>
