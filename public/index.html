<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSINU</title>
<meta name="description" content="인천대학교 데이터과학과 서비스와 소식">
<meta property="og:title" content="DSINU">
<meta property="og:description" content="인천대학교 데이터과학과 서비스와 소식">
<meta property="og:type" content="website">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 fill=%22black%22/><rect x=%225%22 y=%2218%22 width=%225%22 height=%229%22 fill=%22white%22/><rect x=%2213%22 y=%2210%22 width=%225%22 height=%2217%22 fill=%22white%22/><rect x=%2221%22 y=%225%22 width=%225%22 height=%2222%22 fill=%22white%22/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
/* 수치 기준: orch/01_layout_spec.json (thedieline.com 1440px 실측) */
:root{
  --bg:#FFFFFF; --ink:#000000; --sub:#555555; --line:#DADADA;
  --m:clamp(16px,3.34vw,48px);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Wanted Sans Variable","Wanted Sans","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--m)}
.skip{position:absolute;left:-9999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;z-index:20}
.skip:focus{left:8px}

/* 마스트헤드: 워드마크가 콘텐츠 폭 100%를 채운다 (JS로 맞춤) */
.mast{padding-top:clamp(10px,1.4vw,20px)}
.mast .logo{display:inline-block;font-weight:1000;line-height:.76;letter-spacing:-.055em;white-space:nowrap;font-size:22vw}
.mast .org{margin:clamp(12px,1.4vw,20px) 0 0;font-weight:700;font-size:16px;line-height:1.3}

/* 알약 내비 */
.bar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 0 32px;border-bottom:1px solid var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.pill{display:inline-flex;align-items:center;height:40px;padding:0 20px;border:1px solid var(--line);border-radius:999px;font-weight:500;font-size:16px;line-height:1;background:var(--bg);cursor:pointer;white-space:nowrap}
.pill:hover{border-color:var(--ink)}
.pill[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.pill.dark{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tools{display:flex;align-items:center;gap:8px;flex:none}
.icon{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;padding:0}
.icon:hover{border-color:var(--ink)}
.search{display:none}
.search.open{display:block}
.search input{height:40px;border:1px solid var(--ink);border-radius:999px;padding:0 16px;width:min(280px,54vw);background:var(--bg)}

/* 히어로 */
.hero{padding:40px 0 100px}
.hero .cover{aspect-ratio:16/9}
.hero h1{margin:32px 0 0;font-size:clamp(28px,2.78vw,40px);line-height:1.1;letter-spacing:-.03em;font-weight:900}
.hero h1 a:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.hero .dek{margin:16px 0 0;font-size:16px;line-height:1.7;max-width:56em}
.hero .cat{margin-top:8px}

.cover{display:block;overflow:hidden;background:#F1F1F1}
.cover svg,.cover img{display:block;width:100%;height:100%;object-fit:cover}
.cat{display:block;font-size:20px;font-weight:400;line-height:25px;letter-spacing:-.01em}
.cat a:hover{text-decoration:underline}
.go{display:inline-flex;align-items:center;height:36px;padding:0 16px;margin-top:16px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;line-height:1}
.go.off{background:var(--bg);color:var(--sub);border:1px solid var(--line)}

/* 피드: 이미지 990 : 텍스트 330, 간격 24 */
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,330px);gap:24px;border-top:1px solid var(--ink);padding:24px 0 100px}
.row .cover{aspect-ratio:16/9}
.row h2{margin:0;font-size:20px;line-height:24px;letter-spacing:-.02em;font-weight:700}
.row h2 a:hover{text-decoration:underline;text-underline-offset:4px}
.row p{margin:16px 0 0;font-size:14px;line-height:21px}
@media (max-width:760px){.row{grid-template-columns:1fr;padding-bottom:56px}.hero{padding-bottom:56px}}
.none{border-top:1px solid var(--ink);padding:24px 0 100px;font-weight:700}

/* 서비스 디렉터리 */
.dirhead{border-top:1px solid var(--ink);padding:24px 0 20px;display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.dirhead h2{margin:0;font-size:40px;line-height:1.1;letter-spacing:-.03em;font-weight:900}
.subpills{display:flex;flex-wrap:wrap;gap:8px}
.subpills .pill{height:34px;padding:0 14px;font-size:14px}
.dir{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px;padding:8px 0 40px}
@media (max-width:1100px){.dir{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.dir{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 16px}}
.card .cover{aspect-ratio:16/9;margin-bottom:12px}
.card h3{margin:0;font-size:18px;line-height:22px;font-weight:700;letter-spacing:-.02em}
.card h3 a:hover{text-decoration:underline;text-underline-offset:4px}
.card .meta{display:block;font-size:14px;line-height:20px;color:var(--sub);margin-top:4px}
.card.soon h3{color:var(--sub)}

footer{border-top:1px solid var(--ink);margin-top:40px}
footer .wrap{padding-top:24px;padding-bottom:48px;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
footer .flogo{font-weight:1000;font-size:clamp(40px,5vw,72px);line-height:.8;letter-spacing:-.055em}
footer small{display:block;width:100%;font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<div class="wrap">
  <header class="mast">
    <a class="logo" id="logo" href="/" aria-label="DSINU 첫 화면">DSINU</a>
    <p class="org">인천대학교 데이터과학과</p>
  </header>

  <div class="bar">
    <ul class="pills" id="pills" aria-label="분류"></ul>
    <div class="tools">
      <div class="search" id="search"><input id="q" type="search" placeholder="검색" aria-label="서비스와 소식 검색"></div>
      <button class="icon" id="searchBtn" type="button" aria-label="검색 열기" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5.5 5.5"/></svg>
      </button>
    </div>
  </div>

  <main id="main">
    <section class="hero" id="hero"></section>
    <section id="feed"></section>
    <section id="directory" aria-labelledby="dirTitle">
      <div class="dirhead"><h2 id="dirTitle">서비스</h2><div class="subpills" id="subpills" aria-label="서비스 분류"></div></div>
      <div class="dir" id="dir"></div>
    </section>
  </main>
</div>

<footer>
  <div class="wrap">
    <div class="flogo" aria-hidden="true">DSINU</div>
    <a class="pill" href="https://www.haiinu.com/">HAI Lab</a>
    <small>© <span id="yr"></span> 인천대학교 데이터과학과</small>
  </div>
</footer>

<script>
(function(){
  var KIND = { service:'서비스', event:'행사', showcase:'프로젝트', notice:'공지' };
  var FILTERS = ['all','service','event','showcase','notice'];
  var PAL = [['#1F3DFF','#FFFFFF'],['#FFCF24','#000000'],['#00A676','#FFFFFF'],['#FF5A36','#000000'],['#E9E4DA','#000000'],['#000000','#FFCF24'],['#F2A7D0','#000000']];
  var items = [], services = [], filter = 'all', query = '', svcCat = '전체';

  function el(t,c,x){ var e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e; }

  /* 워드마크를 콘텐츠 폭에 정확히 맞춘다 */
  var logo=document.getElementById('logo');
  function fitLogo(){
    var wrap=logo.closest('.wrap'), cs=getComputedStyle(wrap);
    var target=wrap.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    logo.style.fontSize='100px';
    var r=document.createRange(); r.selectNodeContents(logo); var w=r.getBoundingClientRect().width;
    if(w) logo.style.fontSize=(100*target/w)+'px';
  }
  fitLogo();
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitLogo);
  window.addEventListener('resize',fitLogo);

  function rng(seed){ var h=2166136261; for(var i=0;i<seed.length;i++){ h^=seed.charCodeAt(i); h=Math.imul(h,16777619); }
    return function(){ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
  /* 표지 이미지가 없으면 항목 id로 고정된 차트형 표지 */
  function cover(it,w,h){
    if(it.cover){ var img=new Image(); img.src=it.cover; img.alt=''; img.loading='lazy'; img.decoding='async'; return img; }
    var r=rng(it.key), c=PAL[Math.floor(r()*PAL.length)], kind=Math.floor(r()*3), s='<rect width="'+w+'" height="'+h+'" fill="'+c[0]+'"/>';
    var pad=Math.min(w,h)*0.12, base=h-pad, ih=h-pad*2, iw=w-pad*2;
    if(kind===0){ var n=12+Math.floor(r()*8), bw=iw/n;
      for(var i=0;i<n;i++){ var bh=(0.12+r()*0.8)*ih; s+='<rect x="'+(pad+i*bw+bw*0.14)+'" y="'+(base-bh)+'" width="'+(bw*0.72)+'" height="'+bh+'" fill="'+c[1]+'"/>'; }
    } else if(kind===1){ var a=0.2+r()*0.5, m=80+Math.floor(r()*50);
      for(var j=0;j<m;j++){ var x=r(), y=a*x+(1-a)*0.3+(r()-0.5)*0.35; s+='<circle cx="'+(pad+x*iw)+'" cy="'+(base-Math.min(.98,Math.max(.02,y))*ih)+'" r="'+(h*0.012+r()*h*0.014)+'" fill="'+c[1]+'"/>'; }
      s+='<line x1="'+pad+'" y1="'+(base-(1-a)*0.3*ih)+'" x2="'+(w-pad)+'" y2="'+(base-(a+(1-a)*0.3)*ih)+'" stroke="'+c[1]+'" stroke-width="'+(h*0.012)+'"/>';
    } else { var st=18, y0=0.3+r()*0.2, d='M'+pad+' '+(base-y0*ih);
      for(var k=1;k<=st;k++){ y0=Math.min(.95,Math.max(.05,y0+(r()-0.4)*0.16)); d+=' H'+(pad+k*iw/st)+' V'+(base-y0*ih); }
      s+='<path d="'+d+'" fill="none" stroke="'+c[1]+'" stroke-width="'+(h*0.02)+'"/>'; }
    var box=document.createElement('div');
    box.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+s+'</svg>';
    return box.firstChild;
  }

  function linkTo(it){ return it.status==='soon' ? null : it.url; }
  function coverLink(it,w,h){
    var u=linkTo(it), box=el(u?'a':'div','cover');
    if(u){ box.href=u; box.tabIndex=-1; box.setAttribute('aria-hidden','true'); }
    box.appendChild(cover(it,w,h)); return box;
  }
  function heading(tag,it){ var h=el(tag), u=linkTo(it); if(u){ var a=el('a',null,it.title); a.href=u; h.appendChild(a); } else h.textContent=it.title; return h; }
  function catLine(it){
    var span=el('span','cat'), parts=[{t:KIND[it.type],f:function(){ setFilter(it.type); }}];
    if(it.category) parts.push({t:it.category,f:function(){ setFilter('service'); setSvcCat(it.category); }});
    (it.tags||[]).forEach(function(t){ parts.push({t:t,f:function(){ setQuery(t); }}); });
    parts.forEach(function(p,i){ var a=el('a',null,p.t); a.href='#'; a.onclick=function(e){ e.preventDefault(); p.f(); }; span.appendChild(a); if(i<parts.length-1) span.appendChild(document.createTextNode(', ')); });
    return span;
  }
  function action(it){
    if(it.type!=='service') return null;
    if(it.status==='soon') return el('span','go off','준비 중');
    var a=el('a','go','열기'); a.href=it.url; return a;
  }
  function matches(it){
    if(filter!=='all' && it.type!==filter) return false;
    if(!query) return true;
    var hay=[it.title,it.summary,it.category,KIND[it.type]].concat(it.tags||[],it.makers||[]).join(' ').toLowerCase();
    return hay.indexOf(query.toLowerCase())>-1;
  }

  function renderFeed(){
    var list=items.filter(matches), hero=document.getElementById('hero'), feed=document.getElementById('feed');
    hero.innerHTML=''; feed.innerHTML='';
    if(!list.length){ hero.hidden=true; feed.appendChild(el('p','none', query ? '“'+query+'” 검색 결과 없음' : '등록된 항목 없음')); return; }
    hero.hidden=false;
    var f=list[0];
    hero.appendChild(coverLink(f,1920,1080)); hero.appendChild(heading('h1',f));
    if(f.summary) hero.appendChild(el('p','dek',f.summary));
    hero.appendChild(catLine(f));
    var act=action(f); if(act) hero.appendChild(act);
    list.slice(1).forEach(function(it){
      var row=el('article','row'); row.appendChild(coverLink(it,1600,900));
      var t=el('div'); t.appendChild(heading('h2',it)); t.appendChild(catLine(it));
      if(it.summary) t.appendChild(el('p',null,it.summary));
      var a=action(it); if(a) t.appendChild(a);
      row.appendChild(t); feed.appendChild(row);
    });
  }

  function renderDir(){
    var cats=['전체'].concat(services.map(function(s){ return s.category; }).filter(function(c,i,a){ return c && a.indexOf(c)===i; }));
    var sp=document.getElementById('subpills'); sp.innerHTML='';
    if(cats.length>2) cats.forEach(function(c){ var b=el('button','pill',c); b.type='button'; b.setAttribute('aria-pressed',String(svcCat===c)); b.onclick=function(){ setSvcCat(c); }; sp.appendChild(b); });
    var box=document.getElementById('dir'); box.innerHTML='';
    services.filter(function(s){ return svcCat==='전체' || s.category===svcCat; }).forEach(function(s){
      var card=el('article','card'+(s.status==='soon'?' soon':'')); card.appendChild(coverLink(s,1600,900)); card.appendChild(heading('h3',s));
      var meta=[s.category, s.status==='soon'?'준비 중':null].concat(s.makers&&s.makers.length?[s.makers.join(', ')]:[]).filter(Boolean).join(', ');
      card.appendChild(el('span','meta',meta)); box.appendChild(card);
    });
    document.getElementById('directory').hidden=!services.length;
  }

  function renderPills(){
    var ul=document.getElementById('pills'); ul.innerHTML='';
    FILTERS.forEach(function(k){ var li=el('li'), b=el('button','pill',k==='all'?'전체':KIND[k]); b.type='button'; b.setAttribute('aria-pressed',String(filter===k)); b.onclick=function(){ setFilter(k); }; li.appendChild(b); ul.appendChild(li); });
    items.filter(function(i){ return i.feature; }).slice(0,2).forEach(function(i){ var li=el('li'), a=el('a','pill dark',i.feature); a.href=i.url; li.appendChild(a); ul.appendChild(li); });
  }
  function render(){ renderPills(); renderFeed(); renderDir(); }
  function setFilter(k){ filter=k; history.replaceState(null,'',k==='all'?location.pathname:'#'+k); render(); }
  function setSvcCat(c){ svcCat=c; renderDir(); document.getElementById('directory').scrollIntoView({behavior:'smooth',block:'start'}); }
  function setQuery(q){ query=q; openSearch(true); qi.value=q; render(); }

  var sb=document.getElementById('searchBtn'), sw=document.getElementById('search'), qi=document.getElementById('q');
  function openSearch(on){ sw.classList.toggle('open',on); sb.setAttribute('aria-expanded',String(on)); sb.setAttribute('aria-label',on?'검색 닫기':'검색 열기'); if(on) qi.focus(); }
  sb.onclick=function(){ var on=!sw.classList.contains('open'); openSearch(on); if(!on && query){ query=''; qi.value=''; render(); } };
  qi.addEventListener('input',function(){ query=qi.value.trim(); renderFeed(); });
  qi.addEventListener('keydown',function(e){ if(e.key==='Escape'){ query=''; qi.value=''; openSearch(false); renderFeed(); sb.focus(); } });

  var h=location.hash.slice(1); if(KIND[h]) filter=h;
  document.getElementById('yr').textContent=new Date().getFullYear();
  var d0=new Date(), iso=d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0')+'-'+String(d0.getDate()).padStart(2,'0'); /* 로컬(KST) 날짜 — toISOString()은 UTC */
  Promise.all([fetch('/pages.json',{cache:'no-store'}).then(function(r){return r.json();}), fetch('/apps.json',{cache:'no-store'}).then(function(r){return r.json();})])
  .then(function(res){
    var pages=res[0].filter(function(p){ return !p.hidden&&(!p.expires||p.expires>=iso); }).map(function(p){
      return { key:p.slug, type:p.type, title:p.title, summary:p.summary, tags:p.tags, created:p.created, cover:p.cover, url:'/'+p.slug+'/', feature:p.feature, pin:p.pin };
    });
    services=res[1].filter(function(a){ return a.status!=='hidden'; }).map(function(a){
      return { key:a.id, type:'service', title:a.name, summary:a.summary, category:a.category, tags:a.tags, makers:a.makers, created:a.created||'2000-01-01', cover:a.cover, url:a.url, status:a.status, pin:a.pin };
    }).sort(function(a,b){ return b.created.localeCompare(a.created); });
    items=pages.concat(services).sort(function(a,b){ return (b.pin?1:0)-(a.pin?1:0) || b.created.localeCompare(a.created); });
    render();
  }).catch(function(){ document.getElementById('feed').appendChild(el('p','none','목록을 불러오지 못했습니다. 새로고침해 주세요.')); });
})();
</script>
</body>
</html>
